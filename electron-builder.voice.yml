appId: com.ailis.desktop
extends: ./electron-builder.runtime.cjs
productName: AILIS
artifactName: ${productName}-${version}-offline-voice-${arch}.${ext}
electronDist: node_modules/electron/dist
icon: build/icon.png
afterPack: scripts/fix-windows-exe-icon.cjs
directories:
  output: D:/AILIS/Build/AILIS-voice
electronLanguages:
  - en-US
  - zh-CN
  - ja
  - ko
extraResources:
  - from: models/voice-runtime
    to: models/voice-runtime
    filter:
      - "**/*"
      - "!pip-cache/**"
      - "!downloads/**"
      - "!uv-cache/**"
      - "!asr-cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.git/**"
      - "!**/.cache/**"
      - "!voice-venv.backup*/**"
extraMetadata:
  main: electron/main.cjs
asar: true
asarUnpack:
  - electron/**/*.cjs
  - electron/**/*.py
  - scripts/**/*.cjs
  - scripts/**/*.py
  - vendor/ragflow-lite/**/*
npmRebuild: false
win:
  icon: build/icon.ico
  executableName: AILIS
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
