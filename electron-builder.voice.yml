appId: com.ailis.desktop
productName: AILIS
artifactName: ${productName}-${version}-offline-voice-${arch}.${ext}
electronDist: node_modules/electron/dist
icon: build/icon.png
afterPack: scripts/fix-windows-exe-icon.cjs
directories:
  output: D:/AILIS/Build/AILIS-voice
electronLanguages:
  - en-US
  - zh-CN
  - ja
  - ko
files:
  - dist/**/*
  - electron/**/*
  - scripts/mcp-ailis-research-server.cjs
  - scripts/ailis-crawl4ai-worker.py
  - scripts/ailis-python-search-worker.py
  - package.json
  - "!**/*.map"
  - "!node_modules/stockfish/bin/stockfish-*-asm.js"
  - "!node_modules/stockfish/bin/stockfish-18.js"
  - "!node_modules/stockfish/bin/stockfish-18.wasm"
  - "!node_modules/stockfish/bin/stockfish-18-single.js"
  - "!node_modules/stockfish/bin/stockfish-18-single.wasm"
  - "!node_modules/stockfish/bin/stockfish-18-lite.js"
  - "!node_modules/stockfish/bin/stockfish-18-lite.wasm"
extraResources:
  - from: models/voice-runtime
    to: models/voice-runtime
    filter:
      - "**/*"
      - "!pip-cache/**"
      - "!downloads/**"
      - "!uv-cache/**"
      - "!asr-cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.git/**"
      - "!**/.cache/**"
      - "!voice-venv.backup*/**"
extraMetadata:
  main: electron/main.cjs
asar: true
asarUnpack:
  - electron/**/*.cjs
  - electron/**/*.py
  - scripts/**/*.cjs
  - scripts/**/*.py
npmRebuild: false
win:
  icon: build/icon.ico
  executableName: AILIS
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
