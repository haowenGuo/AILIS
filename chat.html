<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>AILIS Chat</title>
    <link rel="stylesheet" href="./src/chat-panel.css">
</head>
<body>
    <div id="chat-shell">
        <div id="drop-overlay">松开后添加文件</div>
        <header id="chat-header">
            <div id="chat-brand">
                <img class="chat-brand-avatar" src="./Resources/Emotes/ailis-small/wave.png" alt="" width="36" height="42">
                <div id="chat-header-text">
                    <div id="chat-title">AILIS</div>
                    <div id="chat-subtitle">陪你聊天，也陪你做事</div>
                </div>
            </div>
            <div id="chat-header-actions">
                <details id="chat-more-actions">
                    <summary class="icon-btn" aria-label="会话操作" title="会话操作">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
                    </summary>
                    <div class="chat-actions-menu">
                        <button id="search-chat-btn" class="icon-btn" type="button" title="查找当前会话 (Ctrl F)">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
                            <span>查找当前会话</span>
                        </button>
                        <button id="copy-chat-btn" class="icon-btn" type="button" aria-label="复制会话" title="复制会话">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span>复制会话</span>
                        </button>
                        <button id="clear-chat-btn" class="icon-btn" type="button" aria-label="清空会话" title="清空会话">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>
                            <span>清空会话</span>
                        </button>
                    </div>
                </details>
                <button id="settings-btn" class="icon-btn" type="button" aria-label="打开控制面板" title="打开控制面板">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.36.33.7.6 1h.1a2 2 0 1 1 0 4H20a1.7 1.7 0 0 0-.6 1Z"></path></svg>
                    <span class="sr-only">打开控制面板</span>
                </button>
                <div class="window-controls" role="group" aria-label="窗口控制">
                    <button id="minimize-btn" class="window-control-btn" type="button" aria-label="最小化聊天窗" title="最小化">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18h12"></path></svg>
                    </button>
                    <button id="maximize-btn" class="window-control-btn" type="button" aria-label="最大化或还原聊天窗" title="最大化 / 还原">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.8"></rect></svg>
                    </button>
                    <button id="close-btn" class="window-control-btn is-close" type="button" aria-label="关闭聊天窗" title="关闭">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <div id="chat-search-bar" hidden role="search">
            <input id="chat-search-input" type="search" placeholder="查找当前会话" aria-label="查找当前会话" autocomplete="off">
            <span id="chat-search-count" role="status"></span>
            <button id="chat-search-prev" type="button" aria-label="上一个" title="上一个"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
            <button id="chat-search-next" type="button" aria-label="下一个" title="下一个"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <button id="chat-search-close" type="button" aria-label="关闭搜索" title="关闭搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <main id="conversation" aria-label="对话记录">
            <div id="message-list" role="log" aria-label="对话记录" aria-live="polite" aria-relevant="additions text"></div>
            <div id="chat-empty-state">
                <img src="./Resources/Emotes/ailis/wave.png" alt="" width="100" height="118">
                <h1>今天，想聊点什么？</h1>
                <p>聊聊日常，或把一个任务交给我。</p>
                <span>也可以拖入文件，一起看看。</span>
            </div>
            <button id="scroll-to-latest" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-5-5 5 5 5-5"></path></svg>
                <span>回到最新</span>
            </button>
        </main>

        <section id="composer-dock" aria-label="发送消息">
            <div id="composer">
                <textarea id="message-input" rows="1" aria-label="消息内容" aria-describedby="composer-hint" placeholder="说点什么，让 AILIS 陪你聊聊"></textarea>
                <div id="vision-preview" hidden>
                    <img id="vision-preview-img" alt="截图预览">
                    <div>
                        <div id="vision-preview-title">已准备截图</div>
                        <div id="vision-preview-meta"></div>
                    </div>
                    <button id="vision-preview-clear" type="button" aria-label="移除截图">×</button>
                </div>
                <div id="file-preview" hidden></div>
                <div id="composer-footer">
                    <div id="composer-actions">
                        <button id="file-btn" class="icon-btn" type="button" aria-label="添加文件" title="添加文件">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                            <span class="sr-only">添加文件</span>
                        </button>
                        <div id="vision-actions">
                            <button id="vision-btn" class="icon-btn" type="button" aria-label="截图识别" title="截图识别">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.5"></circle><path d="m21 15-4.5-4.5L11 16l-2-2-6 6"></path></svg>
                                <svg class="chevron-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                                <span class="sr-only">截图识别</span>
                            </button>
                            <div id="vision-menu" hidden>
                                <button type="button" data-vision-target="chat-window">看对话窗</button>
                                <button type="button" data-vision-target="region">矩形截图</button>
                                <button type="button" data-vision-target="screen">看全屏</button>
                            </div>
                        </div>
                        <button id="voice-btn" class="icon-btn" type="button" aria-label="语音输入" title="语音输入" data-state="mic" hidden>
                            <svg data-icon="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
                            <svg data-icon="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg>
                            <svg data-icon="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                            <svg data-icon="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                            <span class="sr-only">语音输入</span>
                        </button>
                    </div>
                    <button id="send-btn" class="icon-btn" type="button" aria-label="发送" title="发送" data-mode="send">
                        <svg data-icon="arrow-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
                        <svg data-icon="square" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg>
                        <span class="sr-only">发送</span>
                    </button>
                </div>
            </div>
            <div id="composer-meta">
                <div id="chat-status" role="status">已连接桌宠</div>
                <span id="composer-hint">Enter 发送 · Shift+Enter 换行</span>
            </div>
        </section>
    </div>

    <script type="module" src="./src/chat-panel-app.js"></script>
</body>
</html>
