<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #17202a;
      background: #f7fbfc;
    }
    main {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 440px;
      width: 100%;
      height: 100%;
      padding: 74px 76px 58px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.98) 0 58%, rgba(236,248,249,.94) 58% 100%),
        #f7fbfc;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 12px;
      background: linear-gradient(90deg, #2563eb 0 38%, #14b8a6 38% 72%, #f59e0b 72% 100%);
    }
    .copy { position: relative; z-index: 2; max-width: 650px; }
    .eyebrow {
      margin: 0 0 20px;
      color: #2563eb;
      font-size: 23px;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 84px; line-height: 1; font-weight: 800; }
    .tagline {
      margin: 24px 0 30px;
      max-width: 620px;
      font-size: 33px;
      line-height: 1.25;
      font-weight: 600;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin: 0;
      padding: 0;
      color: #43515d;
      font-size: 21px;
      font-weight: 600;
      list-style: none;
    }
    .features li::before { content: "•"; margin-right: 9px; color: #14b8a6; }
    .footer {
      position: absolute;
      left: 76px;
      bottom: 48px;
      color: #66727c;
      font-size: 19px;
      font-weight: 600;
    }
    .character {
      position: absolute;
      right: 10px;
      bottom: -25px;
      width: 510px;
      height: 570px;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 18px 24px rgba(34, 58, 77, .18));
    }
    .version {
      position: absolute;
      top: 54px;
      right: 54px;
      z-index: 2;
      color: #174f4a;
      font-size: 19px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="eyebrow">Open-source desktop AI companion</p>
      <h1>AILIS</h1>
      <p class="tagline">See. Listen. Remember.<br>Get real work done.</p>
      <ul class="features">
        <li>Voice</li>
        <li>Long-term memory</li>
        <li>Computer use</li>
        <li>Evaluated Agent Harness</li>
      </ul>
    </section>
    <span class="version">v1.4.0</span>
    <img class="character" src="../../../Resources/Emotes/ailis/wave.png" alt="AILIS waving">
    <div class="footer">github.com/haowenGuo/AILIS</div>
  </main>
</body>
</html>
