<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="564" viewBox="0 0 1120 564" role="img" aria-labelledby="title desc">
<title id="title">AILIS · Memory and companion experience · Historical results</title>
<desc id="desc">LongMemEval-S: 71.60% QA accuracy, 358 of 500 correct. LoCoMo: 24.69 token-F1 on a 0–100 scale, 1,986 questions. Internal Humanlike evaluation: 78.46 out of 100, 171 judged checkpoints, 61.4% pass rate and 16 hard failures. Separate historical configurations, not current-release certification or a matched Codex comparison.</desc>
<style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-variant-numeric:tabular-nums}.head{font-size:21px;fill:#3038c9;font-weight:600}.body{font-size:21px;fill:#182033}.muted{font-size:15px;fill:#5b6479}.group{font-size:20px;fill:#3038c9;font-weight:600}.score{font-size:28px;fill:#101827;font-weight:700}.count{font-size:16px;fill:#667085}.note{font-size:15px;fill:#4b5568}</style>
