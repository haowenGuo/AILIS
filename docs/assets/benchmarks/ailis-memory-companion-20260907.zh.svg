<text x="6" y="477" class="note">此处采用各自历史配置，不沿用任务执行表的 Luna Max 配置，也不是当前统一 Agent 的重评测。</text>
<text x="6" y="506" class="note">Humanlike 来自 30 天陪伴场景，不是真实用户 30 天实验；这三项暂无同口径的 Codex 对照成绩。</text>
<text x="6" y="535" class="note">问答准确率、token-F1、内部体验评分是不同指标，不能平均成一个总分。完整协议与历史来源见评测文档。</text>
