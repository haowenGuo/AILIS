  <text x="88" y="716" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">71.51% is the frozen holdout estimate.</text>
  <text x="429" y="696" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="700">TARGETED: DIAGNOSTIC</text>
  <text x="429" y="716" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">81.49% is selection-conditioned recovery.</text>
  <text x="794" y="696" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="12" font-weight="700">STABILITY: PAIRED EVIDENCE</text>
  <text x="794" y="716" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">88.31% is not another holdout score.</text>
