<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">AILIS Apple ToolSandbox offline evaluation</title>
  <desc id="desc">All 728 non-RapidAPI scenarios received valid official scores. The frozen 239-scenario holdout mean was 71.51 percent, the selected 155-scenario targeted recovery mean was 81.49 percent, and the 64-scenario stability sample mean was 88.31 percent with a paired gain of 13.29 percentage points. The three evidence layers answer different questions and must not be averaged.</desc>

