<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AILIS A6 GAIA validation baseline</title>
  <desc id="desc">On all 165 GAIA public validation tasks with Luna, AILIS A6 scored 61.82 percent, P1 scored 32.73 percent, and native Codex scored 64.24 percent. A6 answered all 165 tasks and scored 14 of 26 Level 3 tasks.</desc>
