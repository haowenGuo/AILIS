  <text x="84" y="225" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="40" font-weight="700">71.51%</text>
  <text x="84" y="253" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">Frozen holdout mean</text>
  <text x="84" y="278" fill="#64748b" font-family="Arial, sans-serif" font-size="12">239 / 239 scored | 0 errors</text>
  <rect x="84" y="303" width="86" height="27" rx="5" fill="#dbeafe"/>
  <text x="127" y="321" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="11" font-weight="700">PRIMARY</text>

  <rect x="336" y="126" width="252" height="226" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
