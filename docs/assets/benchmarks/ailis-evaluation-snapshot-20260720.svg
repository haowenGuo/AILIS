  <text x="628" y="253" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">Weighted score / 100</text>
  <text x="628" y="278" fill="#64748b" font-family="Arial, sans-serif" font-size="12">171 judged checkpoints</text>
