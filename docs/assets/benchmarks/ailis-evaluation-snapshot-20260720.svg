  <text x="356" y="253" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">Strict Run 1</text>
  <text x="356" y="278" fill="#64748b" font-family="Arial, sans-serif" font-size="12">41 / 53 | memory disabled</text>
