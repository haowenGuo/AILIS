  <text x="408" y="321" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="11" font-weight="700">PROVISIONAL</text>

  <rect x="608" y="126" width="252" height="226" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <rect x="608" y="126" width="252" height="8" rx="4" fill="#0f766e"/>
  <text x="628" y="167" fill="#134e4a" font-family="Arial, sans-serif" font-size="13" font-weight="700">LONGITUDINAL COMPANION</text>
