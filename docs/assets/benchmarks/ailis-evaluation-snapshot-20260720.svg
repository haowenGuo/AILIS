<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AILIS evaluation snapshot</title>
  <desc id="desc">Apple ToolSandbox frozen holdout mean 71.51 percent, GAIA Level 1 strict first run 77.36 percent, internal longitudinal companion score 78.46 out of 100, and an early OSWorld small run with two of four tasks passed.</desc>

  <rect width="1200" height="500" fill="#f8fafc"/>
  <rect x="28" y="24" width="1144" height="452" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="64" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">AILIS Evaluation Snapshot</text>
  <text x="64" y="98" fill="#475569" font-family="Arial, sans-serif" font-size="15">End-to-end evidence with scale and claim status disclosed</text>
  <rect x="937" y="49" width="199" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1037" y="71" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="12" font-weight="700">SNAPSHOT 2026-07-20</text>

