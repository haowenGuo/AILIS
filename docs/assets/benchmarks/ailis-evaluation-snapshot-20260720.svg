  <rect x="64" y="382" width="1072" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="88" cy="411" r="6" fill="#2563eb"/>
  <text x="104" y="416" fill="#334155" font-family="Arial, sans-serif" font-size="13">
    Historical GAIA mean 85.85% remains diagnostic only; strict Run 2 is required before publishing a replacement reproducibility mean.
  </text>
  <text x="64" y="462" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Public benchmark, provisional rerun, internal product eval, and small-sample evidence are intentionally not averaged.</text>
