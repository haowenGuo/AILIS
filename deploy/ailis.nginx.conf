map $http_upgrade $connection_upgrade {
    default upgrade;
    '' upgrade;
}

server {
    listen 80;
    listen [::]:80;
    server_name 101.133.239.56;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://101.133.239.56$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 101.133.239.56;
    client_max_body_size 26m;

    ssl_certificate /etc/letsencrypt/live/101.133.239.56/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/101.133.239.56/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AILIS_SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/ailis.access.log;
    error_log /var/log/nginx/ailis.error.log warn;

    root /var/www/ailis/current;

    location = / {
        try_files /Test/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /Test {
        return 308 /Test/;
    }

    location /Test/ {
        try_files $uri $uri/ /Test/index.html;
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/(assets|Resources)/.+\.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|vrm|vrma|woff2?)$ {
        try_files $uri =404;
        gzip_static on;
        gzip_vary on;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* ^/.+\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/(?:healthz|docs(?:/.*)?|redoc(?:/.*)?|openapi\.json|static(?:/.*)?|blog(?:/.*)?|en/blog(?:/.*)?)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
