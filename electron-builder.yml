appId: com.ailis.desktop
extends: ./electron-builder.runtime.cjs
productName: AILIS
artifactName: ${productName}-${version}-${arch}.${ext}
electronDist: node_modules/electron/dist
icon: build/icon.png
afterPack: scripts/fix-windows-exe-icon.cjs
directories:
  output: F:/AILIS/Build/AILIS
electronLanguages:
  - en-US
  - zh-CN
  - ja
  - ko
extraMetadata:
  main: electron/main.cjs
asar: true
asarUnpack:
  - dist/**/*
  - electron/**/*.cjs
  - electron/**/*.py
  - scripts/**/*.cjs
  - scripts/**/*.py
  - vendor/ragflow-lite/**/*
npmRebuild: false
win:
  icon: build/icon.ico
  executableName: AILIS
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  packElevateHelper: false
  include: installer/ailis-runtime-components.nsh
portable:
  artifactName: ${productName}-Portable-${version}-win-${arch}.${ext}
linux:
  icon: build/icon.png
  executableName: ailis
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
