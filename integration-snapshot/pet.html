<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>AILIS Pet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
        }

        #pet-shell {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: default;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #pet-shell[data-renderer-backend="unity"] #canvas-container {
            visibility: hidden;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div id="pet-shell" data-renderer-backend="unity">
        <div id="canvas-container"></div>
    </div>

    <script type="module" src="./src/pet-app.js"></script>
</body>
</html>
