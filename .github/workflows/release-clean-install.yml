name: Release clean-install gate

on:
  workflow_dispatch:
    inputs:
      backup_old_v144:
        description: Back up the withdrawn original v1.4.4 before replacement
        type: boolean
        default: false
      backup_only:
        description: Run only the original-release backup
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup-old-v144:
    if: inputs.backup_old_v144
    # GitHub requires write-level release visibility to read unpublished drafts.
    # The backup script performs only GET/download operations.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify all original draft assets without changing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/backup-withdrawn-v144.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: original-v144-backup
          retention-days: 90
          compression-level: 0
          path: release-backup-v144/
  native-release:
    if: ${{ !inputs.backup_only }}
    name: Native package and offline acceptance - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      UV_HTTP_TIMEOUT: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install build dependencies on the native runner
        run: pnpm install --frozen-lockfile
      - name: Prepare native terminal executable permissions
        run: node scripts/prepare-native-node.cjs
      - name: Source packaging and ASR contracts
        run: >-
          node --test --test-concurrency=1
          tests/bundled-asr-install.test.mjs
          tests/local-asr-manager.test.mjs
          tests/asr-latency-presets.test.mjs
          tests/voice-runtime-bootstrap.test.mjs
          tests/ailis-code-mode-packaging.test.mjs
          tests/native-path-identity.test.mjs
      - name: Fresh-profile system-only-PATH source execution
        id: cold
        run: node scripts/test-clean-runtime.mjs --output release/evidence/${{ matrix.target }}/source-cold-runtime.json
      - name: Collect native Windows shell startup evidence on failure
        if: failure() && runner.os == 'Windows' && steps.cold.conclusion == 'failure'
        run: node scripts/probe-cold-shells.mjs release/evidence/win32-x64/shell-startup-diagnostic.json
      - name: Stage pinned private Python, native CPU dependencies and complete Whisper Small
        run: node scripts/prepare-bundled-asr.mjs
      - name: Build native versioned release artifacts (no publishing)
        run: node scripts/build-native-release.mjs
      - name: Verify actual packaged code and relocated offline recognition
        run: node scripts/build-native-release.mjs --verify
      - name: Windows real NSIS install, installed offline ASR, first launch and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/validate-clean-install.ps1
          -ArtifactRoot "${{ github.workspace }}\release"
          -ExpectedVersion "1.4.4"
          -ReportRoot "${{ github.workspace }}\release\evidence\win32-x64\nsis"
          -VerifyBundledRuntime
      - name: Upload native packages and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ailis-v1.4.4-${{ matrix.target }}-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.blockmap
            release/latest*.yml
            release/*.json
            release/SHA256SUMS-*.txt
            release/evidence/**
