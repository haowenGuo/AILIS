name: Release clean-install gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-clean-install:
    name: Build and validate on clean Windows
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python for source integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/release-test.txt

      - name: Install spreadsheet parser test dependencies
        run: python -m pip install -r .github/requirements/release-test.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release tests
        run: >-
          pnpm exec node --test --test-concurrency=1
          tests/ailis-web-vrm.test.mjs
          tests/ailis-character-runtime.test.mjs
          tests/ailis-persona-renderer.test.mjs
          tests/desktop-llm-provider.test.mjs
          tests/ailis-runtime.test.mjs
          tests/ailis-gateway.test.mjs
          tests/ailis-agent-execution-flow.test.mjs
          tests/ailis-agent-runner.test.mjs
          tests/ailis-code-mode-runtime.test.mjs
          tests/ailis-persona-context-store.test.mjs
          tests/ailis-context-budget.test.mjs
          tests/ailis-context-compiler.test.mjs
          tests/ailis-context-dedupe-chain.test.mjs
          tests/ailis-model-input-builder.test.mjs
          tests/ailis-context-artifact-store.test.mjs
          tests/ailis-tool-contracts.test.mjs
          tests/ailis-hosted-runtime.test.mjs
          tests/desktop-elevenlabs-tts-settings.test.mjs
          tests/store-language-compat.test.mjs
          tests/codex-model-bridge.test.mjs
          tests/ailis-release-manifest.test.mjs
          tests/ailis-documentation.test.mjs
          tests/ailis-production-closure.test.mjs
          tests/ailis-code-mode-packaging.test.mjs
          tests/ailis-unified-agent.test.mjs
          tests/ailis-tool-output-integrity.test.mjs
          tests/local-asr-manager.test.mjs
          tests/asr-latency-presets.test.mjs
          tests/voice-runtime-bootstrap.test.mjs
          tests/desktop-hosted-tts.test.mjs
          tests/control-panel-draft.test.mjs
          tests/llm-connection-profiles.test.mjs
          tests/codex-connection-lifecycle.test.mjs
          tests/pet-drag-layout.test.mjs
          tests/avatar-dialogue-bubble.test.mjs
          tests/gaia-answer-adapter.test.mjs
          tests/ailis-desktop-real-gaia-eval.test.mjs

      - name: Build release packages
        run: pnpm release:core -- --output-root "${{ github.workspace }}\release"

      - name: Verify release source identity
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $manifest = Get-Content -Raw "release/core/AILIS-Release-core-$version.json" | ConvertFrom-Json
          if ($manifest.version -ne $version -or $manifest.source.commit -ne $env:GITHUB_SHA -or $manifest.source.dirty -cne $false) {
            throw "Release manifest must match this clean source commit and package version."
          }

      - name: Verify chat, settings and quick controls with real sandboxed renderers
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:AILIS_PANEL_TEST_DIST = '1'
          foreach ($test in @('chat-panel-smoke.cjs', 'llm-connection-panel-smoke.cjs', 'quick-controls-smoke.cjs', 'pet-window-layout-smoke.cjs')) {
            pnpm exec electron "tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Desktop renderer smoke failed: $test" }
          }

      - name: Validate clean install, first launch, portable launch, and uninstall
        shell: pwsh
        run: >-
          ./scripts/validate-clean-install.ps1
          -ArtifactRoot "${{ github.workspace }}\release\core"
          -ExpectedVersion "${{ steps.release.outputs.version }}"
          -ReportRoot "${{ github.workspace }}\release-smoke"

      - name: Upload release packages and clean-install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ailis-v${{ steps.release.outputs.version }}-clean-install-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            release/core/*.exe
            release/core/*.blockmap
            release/core/*.yml
            release/core/*.json
            release/core/SHA256SUMS.txt
            release-smoke/**
