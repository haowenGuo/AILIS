name: Release clean-install gate

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Optional successful build run to publish without rebuilding'
        type: string
        default: ''
      verified_sha:
        description: 'Exact tested source commit for the existing artifact'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows-clean-install:
    if: inputs.verified_run_id == ''
    name: Build and validate on clean Windows
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python for source integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/release-test.txt

      - name: Install spreadsheet parser test dependencies
        run: python -m pip install -r .github/requirements/release-test.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release tests
        run: >-
          pnpm exec node --test --test-concurrency=1
          tests/ailis-web-vrm.test.mjs
          tests/ailis-character-runtime.test.mjs
          tests/ailis-persona-renderer.test.mjs
          tests/desktop-llm-provider.test.mjs
          tests/ailis-runtime.test.mjs
          tests/ailis-gateway.test.mjs
          tests/ailis-agent-execution-flow.test.mjs
          tests/ailis-agent-runner.test.mjs
          tests/ailis-code-mode-runtime.test.mjs
          tests/ailis-persona-context-store.test.mjs
          tests/ailis-context-budget.test.mjs
          tests/ailis-context-compiler.test.mjs
          tests/ailis-context-dedupe-chain.test.mjs
          tests/ailis-model-input-builder.test.mjs
          tests/ailis-context-artifact-store.test.mjs
          tests/ailis-tool-contracts.test.mjs
          tests/ailis-hosted-runtime.test.mjs
          tests/desktop-elevenlabs-tts-settings.test.mjs
          tests/store-language-compat.test.mjs
          tests/codex-model-bridge.test.mjs
          tests/ailis-release-manifest.test.mjs
          tests/ailis-documentation.test.mjs
          tests/ailis-production-closure.test.mjs
          tests/ailis-code-mode-packaging.test.mjs
          tests/ailis-unified-agent.test.mjs
          tests/ailis-unified-compaction.test.mjs
          tests/ailis-tool-output-integrity.test.mjs
          tests/local-asr-manager.test.mjs
          tests/asr-latency-presets.test.mjs
          tests/voice-runtime-bootstrap.test.mjs
          tests/desktop-hosted-tts.test.mjs
          tests/control-panel-draft.test.mjs
          tests/llm-connection-profiles.test.mjs
          tests/codex-connection-lifecycle.test.mjs
          tests/pet-drag-layout.test.mjs
          tests/avatar-dialogue-bubble.test.mjs
          tests/gaia-answer-adapter.test.mjs
          tests/ailis-desktop-real-gaia-eval.test.mjs

      - name: Build release packages
        run: pnpm release:core -- --output-root "${{ github.workspace }}\release"

      - name: Verify release source identity
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $manifest = Get-Content -Raw "release/core/AILIS-Release-core-$version.json" | ConvertFrom-Json
          if ($manifest.version -ne $version -or $manifest.source.commit -ne $env:GITHUB_SHA -or $manifest.source.dirty -cne $false) {
            throw "Release manifest must match this clean source commit and package version."
          }

      - name: Verify chat, settings and quick controls with real sandboxed renderers
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:AILIS_PANEL_TEST_DIST = '1'
          foreach ($test in @('chat-panel-smoke.cjs', 'llm-connection-panel-smoke.cjs', 'quick-controls-smoke.cjs', 'pet-window-layout-smoke.cjs')) {
            pnpm exec electron "tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Desktop renderer smoke failed: $test" }
          }

      - name: Validate clean install, first launch, portable launch, and uninstall
        shell: pwsh
        run: >-
          ./scripts/validate-clean-install.ps1
          -ArtifactRoot "${{ github.workspace }}\release\core"
          -ExpectedVersion "${{ steps.release.outputs.version }}"
          -ReportRoot "${{ github.workspace }}\release-smoke"

      - name: Upload release packages and clean-install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ailis-v${{ steps.release.outputs.version }}-clean-install-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          path: |
            release/core/*.exe
            release/core/*.blockmap
            release/core/*.yml
            release/core/*.json
            release/core/SHA256SUMS.txt
            release-smoke/**

  publish-verified-hotfix:
    if: inputs.verified_run_id != ''
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      VERIFIED_SHA: ${{ inputs.verified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and download its exact artifacts
        shell: pwsh
        run: |
          if ($env:VERIFIED_RUN_ID -notmatch '^\d+$' -or $env:VERIFIED_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source identity' }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:VERIFIED_RUN_ID" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne $env:VERIFIED_SHA -or $run.path -ne '.github/workflows/release-clean-install.yml') { throw 'Source run must be a successful clean-install gate for this SHA' }
          gh run download $env:VERIFIED_RUN_ID --name "ailis-v1.4.2-clean-install-$env:VERIFIED_SHA" --dir verified
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $manifest = Get-Content -Raw verified/release/core/AILIS-Release-core-1.4.2.json | ConvertFrom-Json
          $report = Get-Content -Raw verified/release-smoke/clean-install-report.json | ConvertFrom-Json
          if ($manifest.version -ne '1.4.2' -or $manifest.source.commit -ne $env:VERIFIED_SHA -or $manifest.source.dirty -cne $false -or $report.success -cne $true) { throw 'Source/install evidence mismatch' }
          foreach ($line in Get-Content verified/release/core/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-fA-F0-9]{64})\s+(.+)$') { throw 'Malformed checksum entry' }
            $expected = $Matches[1]; $name = $Matches[2].TrimStart('*')
            if ([IO.Path]::GetFileName($name) -ne $name) { throw 'Unsafe checksum path' }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "verified/release/core/$name").Hash
            if ($actual -ne $expected) { throw "Checksum mismatch: $name" }
          }
          $manifest.artifacts | Select-Object file,bytes,sha256 | ConvertTo-Json -Depth 3
      - name: Preserve previous tag and publish the verified 1.4.2 hotfix
        shell: pwsh
        run: |
          $previous = '5c5a3a47b7144e5e4e79a5218b68d953ee63aaba'
          $tag = gh api "repos/$env:GH_REPO/git/ref/tags/v1.4.2" | ConvertFrom-Json
          if ($tag.object.sha -ne $previous) { throw 'Release tag changed; review required before replacement' }
          git push origin "${previous}:refs/tags/v1.4.2-before-compaction-20260908"
          if ($LASTEXITCODE -ne 0) { throw 'Previous release tag backup failed' }
          git push origin "$($env:VERIFIED_SHA):refs/heads/main"
          if ($LASTEXITCODE -ne 0) { throw 'Main update is not a safe fast-forward' }
          git push "--force-with-lease=refs/tags/v1.4.2:$previous" origin "$($env:VERIFIED_SHA):refs/tags/v1.4.2"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag update failed' }
          $files = @(Get-ChildItem verified/release/core -File | Where-Object { $_.Extension -in @('.exe','.blockmap','.yml','.json') -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          $files += (Resolve-Path verified/release-smoke/clean-install-report.json).Path
          gh release upload v1.4.2 @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; previous artifacts remain backed up locally' }
          gh release edit v1.4.2 --target $env:VERIFIED_SHA --notes-file docs/releases/v1.4.2.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
