name: AILIS beta feedback
description: Report a real desktop workflow from the v1.4.0 beta
title: "[Beta]: "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: Thanks for testing AILIS on a real workflow. Remove API keys, account details, personal names, and sensitive file paths before submitting.
  - type: input
    id: version
    attributes:
      label: AILIS version
      placeholder: v1.4.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Windows installer
        - Windows portable
        - Source checkout
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Real task and expected result
      description: Describe what you asked AILIS to do and what a successful result would look like.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Completed
        - Partially completed
        - Failed
        - Stuck or timed out
    validations:
      required: true
  - type: textarea
    id: chain
    attributes:
      label: What happened
      description: Include total time, manual corrections, the first problematic step, and the tools or context involved.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, relevant hardware, model/provider, and whether voice, screen context, files, network, or computer control were used.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Attach sanitized logs, screenshots, or video only when you are comfortable sharing them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and sensitive personal or business information from the submitted evidence.
          required: true
